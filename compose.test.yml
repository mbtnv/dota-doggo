services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dota_doggo_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dota_doggo_test"]
      interval: 2s
      timeout: 3s
      retries: 15
